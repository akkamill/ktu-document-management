spring:
  application:
    name: ktu-document-management
  datasource:
    url: jdbc:postgresql://localhost:5432/dms_db
    username: postgres
    password: your_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  storage:
    upload-dir: ./uploads