spring:
  application:
    name: ktu-document-management
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dms_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:dms123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
#  liquibase:
#    change-log: classpath:/db/changelog/db.changelog-master.yaml

app:
  storage:
    upload-dir: ./uploads