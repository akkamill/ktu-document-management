databaseChangeLog:
  - changeSet:
      id: 1-create-documents-table
      author: ktu-student
      changes:
        - createTable:
            tableName: documents
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: author
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: storage_path
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: upload_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false