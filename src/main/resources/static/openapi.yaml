openapi: 3.0.3
info:
  title: Document Management Service API
  description: |
    ### KTU Semester Project
    A RESTful backend service for uploading, searching, and managing documents (`PDF`, `DOCX`, `XLSX`). 
    
    **Key Features:**
    * Secure file uploads with metadata extraction.
    * Cryptographic duplicate detection (SHA-256).
    * Advanced search and filtering.
    * Bulk export capabilities (ZIP & Excel).
  version: 1.0.0
  contact:
    name: Kamil Alakbarov
    email: student@ktu.edu
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local Development Server

tags:
  - name: Documents
    description: Core operations for document lifecycle management.

paths:
  /api/v1/documents/upload:
    post:
      tags:
        - Documents
      summary: Upload a new document
      operationId: uploadDocument
      description: |
       - Securely uploads a document file, extracts metadata, and calculates a SHA-256 hash to prevent duplicate uploads. **Max file size: 50MB.**
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - author
              properties:
                file:
                  type: string
                  format: binary
                  description: The document binary file.
                author:
                  type: string
                  description: The name of the person uploading the document.
                  example: Jane Doe
      responses:
        '201':
          description: Document successfully uploaded and metadata saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDTO'
        '400':
          description: Invalid file type or missing request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - A document with this exact content already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/documents/search:
    get:
      tags:
        - Documents
      summary: Search and filter documents
      operationId: searchDocuments
      description: Retrieves a list of documents matching the optional search criteria.
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            example: Report
        - name: type
          in: query
          required: false
          schema:
            type: string
            example: pdf
        - name: author
          in: query
          required: false
          schema:
            type: string
            example: Jane Doe
      responses:
        '200':
          description: A list of matching documents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentDTO'

  /api/v1/documents/{id}/download:
    get:
      tags:
        - Documents
      summary: Download a specific document
      operationId: downloadDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: The document file stream.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/documents/report:
    get:
      tags:
        - Documents
      summary: Generate an Excel report
      operationId: generateReport
      responses:
        '200':
          description: The generated Excel report.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /api/v1/documents/export-zip:
    get:
      tags:
        - Documents
      summary: Export search results as a ZIP file
      operationId: exportZip
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: author
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A generated ZIP file containing the requested documents.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    DocumentDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          example: Q1_Financial_Report.pdf
        type:
          type: string
          example: pdf
        author:
          type: string
          example: Jane Doe
        uploadDate:
          type: string
          format: date-time
          example: '2026-05-09T14:15:22Z'

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-05-09T14:15:22Z'
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Invalid file type. Only PDF, DOCX, and XLSX are allowed.